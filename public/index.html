<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanvi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <a href="#/" class="brand">Sanvi <span id="dirname"></span></a>
  <span id="live" title="live updates">●</span>
  <span id="proj-label" title="Current project" hidden></span>
  <select id="proj-sel" title="Current project: scopes the board and new tickets (P)" aria-label="Current project" hidden></select>
  <button id="cmd-btn" type="button" title="Command menu (Ctrl+K)">Ctrl+K</button>
  <button id="help-btn" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  <button id="trash-btn" type="button" title="Deleted tickets (restorable for 30 days)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.6 9.5h6.8L12 4M6.5 7v4M9.5 7v4"/></svg>Trash</button>
  <button id="notes-btn" type="button" title="Quick notes not tied to a ticket (g; m adds one)">Notes</button>
  <button id="idea-btn" type="button" title="Quick idea (i)">+ Idea (i)</button>
  <button id="new-btn" type="button" title="New ticket (n)">+ New (n)</button>
</header>
<div id="toast" role="status"></div>
<main id="view"></main>
<script type="module" src="/app.js"></script>
</body>
</html>
